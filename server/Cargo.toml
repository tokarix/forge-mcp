[package]
name = "server"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
audit = { version = "0.1.0", path = "../audit" }
axum = "0.8"
base64 = "0.22"
domain = { version = "0.1.0", path = "../domain", features = ["utoipa"] }
forge = { version = "0.1.0", path = "../forge" }
orchestrator = { version = "0.1.0", path = "../orchestrator" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.50.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.18"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-scalar = { version = "0.3", features = ["axum"] }

[dev-dependencies]
hmac = "0.12"
sha2 = "0.10"
async-trait = "0.1.89"
http-body-util = "0.1.3"
rmcp = { version = "1.2.0", features = ["client", "transport-io"] }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1.50.0", features = ["io-util"] }
tower = { version = "0.5", features = ["util"] }
transport = { version = "0.1.0", path = "../transport" }
urlencoding = "2.1"
wiremock = "0.6"
