when:
  - event: pull_request
  - event: push
    branch: master

depends_on:
  - checks

# Keep the checkout at the shared volume root. The rootless service must not
# create the default /woodpecker/src/<forge>/<owner>/<repo> hierarchy.
workspace:
  base: /woodpecker
  path: .

steps:
  forgejo-preflight:
    image: codeberg.org/forgejo/forgejo:16.0.3-rootless
    commands:
      - id
      - pwd
      - test -r ci/forgejo-service.sh
      - test -x ci/forgejo-service.sh
      - test -w /tmp
      - forgejo --version

  forgejo:
    image: codeberg.org/forgejo/forgejo:16.0.3-rootless
    depends_on:
      - forgejo-preflight
    detach: true
    commands:
      - ci/forgejo-service.sh
    environment:
      FORGEJO_BOOTSTRAP_USERNAME: forge-mcp-ci
      FORGEJO_BOOTSTRAP_PASSWORD: forge-mcp-ci-disposable-password
      FORGEJO_BOOTSTRAP_EMAIL: forge-mcp-ci@example.invalid
      FORGEJO_WEBHOOK_ALLOWED_HOST_LIST: "*"

  integration:
    image: rust:1.94-slim
    depends_on:
      - forgejo
    environment:
      CARGO_TARGET_DIR: /tmp/target
      FORGEJO_TEST_BASE_URL: http://forgejo:3000
      FORGEJO_TEST_USERNAME: forge-mcp-ci
      FORGEJO_TEST_PASSWORD: forge-mcp-ci-disposable-password
      FORGEJO_TEST_WEBHOOK_LISTEN_ADDR: 0.0.0.0:38080
    commands:
      - apt-get update
      - apt-get install -y --no-install-recommends git
      - cargo test -p forge --test forgejo_ci_smoke -- --ignored --nocapture
      - cargo test -p forge --test forgejo_issue_dependencies -- --ignored --nocapture
      - cargo test -p server --test forgejo_reword -- --ignored --nocapture
      - for address in $$(hostname -i); do case "$${address}" in *.*) export FORGEJO_TEST_WEBHOOK_CALLBACK_IP=$${address}; break ;; esac; done
      - test -n "$${FORGEJO_TEST_WEBHOOK_CALLBACK_IP}"
      - FORGEJO_TEST_WEBHOOK_CALLBACK_BASE_URL=http://$${FORGEJO_TEST_WEBHOOK_CALLBACK_IP}:38080 cargo test -p server --test forgejo_issue_label_webhooks -- --ignored --nocapture
