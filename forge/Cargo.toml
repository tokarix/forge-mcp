[package]
name = "forge"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.89"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
domain = { version = "0.1.0", path = "../domain" }
hmac = "0.13.0"
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto", "use_pem"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "query", "stream", "rustls-no-provider"] }
rustls = { version = "0.23.37", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
urlencoding = "2.1"

[dev-dependencies]
tracing-subscriber = "0.3"
wiremock = "0.6"
